# Render Blueprint — deploy with "New +" -> "Blueprint" and this repo.
# Cheapest always-on setup: Starter web service ($7/mo) + 1GB disk for SQLite ($1/mo).
services:
  - type: web
    name: joyeuses-orders
    runtime: docker
    plan: starter          # always-on; free plan sleeps and will drop the kitchen display
    rootDir: restaurant-system
    healthCheckPath: /login
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value
      - key: DATABASE_URL
        value: sqlite:////data/restaurant.db
      - key: GUNICORN_WORKERS
        value: "1"                   # required for SQLite; raise if you move to Postgres/MySQL
      - key: WORKER_CLASS
        value: eventlet
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
