<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | J's CCC & Bar</title>
    <link rel="stylesheet" href="/restaurant-system/static/design.css">
    <style>
        /* ===============================
           RESET & BASE STYLES
        =============================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #FFFDED; /* Ivory */
            color: #001011; /* Rich black */
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===============================
           NAVBAR
        =============================== */
        .site-header {
            background-color: #001011;
            color: #FFFDED;
        }

        .site-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .site-navbar__logo a {
            font-size: 1.2rem;
            font-weight: bold;
            color: #FFFDED;
        }

        .site-navbar__menu {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .site-navbar__menu-item a {
            color: #FFFDED;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .site-navbar__menu-item a:hover {
            color: #F2542D; /* Cinnabar */
        }

        /* ===============================
           MAIN CONTENT
        =============================== */
        main {
            padding: 2rem;
        }

        .welcome-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 2rem;
            color: #F2542D;
        }

        /* ===============================
           LOGIN FORM
        =============================== */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .login-form__input {
            width: 320px;
            padding: 0.6rem 0.8rem;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
        } 

        .login-form__input:focus {
            outline: none;
            border-color: #0681B1;
            box-shadow: 0 0 0 4px rgba(6,129,177,0.12);
        }

        .login-form__actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 0.5rem;
        }

        .login-form__forgot {
            font-size: 0.9rem;
            color: #0681B1;
            cursor: pointer;
            transition: color 0.3s;
        }

        .login-form__forgot:hover {
            color: #F2542D;
        }

        .login-form__button {
            background-color: #F2542D;
            color: #FFFDED;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-left: 1rem;
        }

        .login-form__button:hover {
            background-color: #0681B1;
        }

        /* ===============================
           USER ROLE TABS
        =============================== */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .tab {
            background-color: #E0E0E0;
            color: #001011;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            font-weight: bold;
        }

        .tab:hover {
            background-color: #F2542D;
            color: #FFFDED;
        }

        .tab.active {
            background-color: #001011;
            color: #FFFDED;
        }

        /* ===============================
           FOOTER
        =============================== */
        .site-footer {
            background-color: #001011;
            color: #FFFDED;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            position: sticky;
            bottom: 0;
            width: 100%;
            top: 100vh;
        }

        .site-footer__text {
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="site-header">
        <nav class="site-navbar">
            <div class="site-navbar__logo">
                <a href="/restaurant-system/templates/home.html">Joyeuse's Caribbean Creole Cuisine & Bar</a>
            </div>
            <ul class="site-navbar__menu">
                <li class="site-navbar__menu-item"><a href="home.html">Back to Home</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content -->
    <main>
        <h1 class="welcome-text">Login</h1>

        <div class="login-container">
            <!-- Tabs for selecting user role -->
            <div class="tab-container">
                <div class="tab active" data-role="admin">Admin</div>
                <div class="tab" data-role="chef">Chef</div>
                <div class="tab" data-role="server">Server</div>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <input type="text" class="login-form__input" placeholder="Username" required>
                <input type="password" class="login-form__input" placeholder="Password" required>

                <div class="login-form__actions">
                    <a href="#" class="login-form__forgot">Forgot password?</a>
                    <button type="submit" class="login-form__button">Log In</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2025 Joyeuse's Caribbean Creole Cuisine & Bar. All rights reserved.</p>
    </footer>

    <script>
        // Handle tab switching
        const tabs = document.querySelectorAll('.tab');
        let selectedRole = 'admin'; // default

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                selectedRole = tab.dataset.role;
            });
        });

        // Handle login form redirect
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();

            // Redirect to the corresponding dashboard based on role
            if (selectedRole === 'admin') {
                window.location.href = 'admin/dashboard.html';
            } else if (selectedRole === 'chef') {
                window.location.href = 'kitchen.html';
            } else if (selectedRole === 'server') {
                window.location.href = 'front.html';
            }
        });
    </script>
</body>
</html>
