<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitchen Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
         :root {
            --accent: #ff6a3d;
            --header-start: #001011;
            --header-end: #2d2d2d;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            font-family: "Poppins", sans-serif;
            background: #FFFDED;
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .site-navbar {
            background: linear-gradient(to bottom, var(--header-start) 0%, var(--header-start) 55%, var(--header-end) 100%);
        }
        
        .site-navbar .navbar-brand {
            color: #ffffff;
            font-weight: 400;
            letter-spacing: .2px;
        }
        
        .site-navbar .navbar-brand:hover {
            color: #ffffff;
        }
        
        .site-navbar .nav-link {
            color: #ffffff !important;
            font-weight: 400;
            padding: .5rem 1rem !important;
        }
        
        .site-navbar .nav-link.active {
            color: #ffffff !important;
            border-bottom: 2px solid var(--accent);
        }
        
        .site-navbar .nav-link:hover {
            color: #ffffff !important;
            opacity: .9;
        }
        
        .card {
            background: #fff;
            color: #000;
            border: 2px solid var(--accent) !important;
            border-radius: 12px;
            box-shadow: none;
        }
        
        .card-title {
            color: #000;
        }
        
        .list-group-item {
            background: #fff;
            color: #000;
            border-color: var(--accent) !important;
        }
        
        .btn-status {
            border-radius: 20px;
            font-size: .85rem;
            padding: 4px 12px;
        }
        
        .status-pending {
            background-color: #ffc107;
            color: #fff;
        }
        
        .status-progress {
            background-color: #17a2b8;
            color: #fff;
        }
        
        .status-done {
            background-color: #28a745;
            color: #fff;
        }
        
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        span,
        li,
        label,
        small,
        .card-body,
        .table,
        .form-label,
        .form-control,
        .form-select {
            color: #000 !important;
        }
        
        a {
            color: #000;
        }
        
        a:hover {
            color: #000;
        }
        
        main {
            padding-top: 1.25rem;
            flex: 1;
        }
        
        .site-footer {
            background: linear-gradient(to top, var(--header-start) 0%, var(--header-start) 65%, var(--header-end) 100%);
            color: #ffffff;
            text-align: center;
            padding: .5rem 0;
            font-size: .95rem;
            font-family: "Poppins", sans-serif;
        }
        
        .site-footer small {
            color: #ffffff !important;
            opacity: 1;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Joyeuse's Caribbean Creole Cuisine &amp; Bar</a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>
            <div class="collapse navbar-collapse justify-content-end" id="topNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Front</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Kitchen</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Reservations</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid p-4">
        <h4 class="mb-4">Incoming Orders</h4>

        <div class="row g-4" id="orders-container">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Order #101</h5>
                        <p class="mb-1"><strong>Table:</strong> 3</p>
                        <p class="mb-2"><strong>Type:</strong> Dine-in</p>

                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between">
                                Beef Crowich <span>x2</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                Pate Kode <span>x1</span>
                            </li>
                        </ul>

                        <div class="d-flex justify-content-between">
                            <button class="btn btn-status status-pending">Pending</button>
                            <button class="btn btn-status status-progress">In Progress</button>
                            <button class="btn btn-status status-done">Completed</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container-fluid">
            <small>© 2025 Joyeuse's Caribbean Creole Cuisine &amp; Bar. All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
