<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitchen Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Poppins", sans-serif;
        }
        
        .btn-status {
            border-radius: 20px;
            font-size: 0.85rem;
            padding: 4px 12px;
        }
        
        .status-pending {
            background-color: #ffc107;
            color: #000;
        }
        
        .status-progress {
            background-color: #17a2b8;
            color: #fff;
        }
        
        .status-done {
            background-color: #28a745;
            color: #fff;
        }
        
        nav {
            color: rgba(71, 135, 120, 1);
        }
        
        nav .nav-link {
            color: rgba(71, 135, 120, 1);
        }
        
        nav .nav-link.active {
            background-color: rgba(71, 135, 120, 0.1);
            color: rgba(71, 135, 120, 1);
        }
        
        nav i {
            color: rgba(71, 135, 120, 1);
        }
        
        nav .fw-bold {
            color: rgba(71, 135, 120, 1);
        }
        
        nav .nav-link:hover {
            background-color: #FFDAB9;
            color: rgba(71, 135, 120, 1);
        }
        /* Make brand text a bit smaller */
        
        .brand-text {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <!-- Sidebar -->
            <nav class="col-md-2 d-flex flex-column bg-light p-3">
                <div class="text-center py-3">
                    <a href="#" class="text-decoration-none fw-bold text-nowrap brand-text">
            Joyeuse's Caribbean
          </a>
                    <hr class="mt-2 mb-0" style="border-top: 2px solid rgba(71, 135, 120, 1);">
                </div>

                <!-- User Name -->
                <div class="d-flex justify-content-center align-items-center mb-4">
                    <i class="fa fa-user me-2"></i>
                    <span class="fw-bold">Kitchen Staff</span>
                </div>

                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link active" href="#">
                            <i class="fa-solid fa-kitchen-set me-2"></i> Orders
                        </a>
                    </li>
                </ul>

                <!-- Log Out Button -->
                <div class="mt-auto text-center">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-2x mb-1"></i>
                    <div>Log Out</div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 p-4">
                <h4 class="mb-4" style="color: rgba(71, 135, 120, 1);">Incoming Orders</h4>

                <!-- Orders List -->
                <div class="row g-4" id="orders-container">

                    <!-- Single Example Order Card -->
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title">Order #101</h5>
                                <p class="mb-1"><strong>Table:</strong> 3</p>
                                <p class="mb-2"><strong>Type:</strong> Dine-in</p>

                                <ul class="list-group list-group-flush mb-3">
                                    <li class="list-group-item d-flex justify-content-between">
                                        Beef Crowich <span>x2</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        Pate Kode <span>x1</span>
                                    </li>
                                </ul>

                                <div class="d-flex justify-content-between">
                                    <button class="btn btn-status status-pending">Pending</button>
                                    <button class="btn btn-status status-progress">In Progress</button>
                                    <button class="btn btn-status status-done">Completed</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
