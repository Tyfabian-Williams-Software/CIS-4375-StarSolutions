<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/restaurant-system/static/design.css">
    <style>
        .menu-container {
            flex-wrap: wrap;
            /* allow wrapping to next line */
            gap: 10px;
            /* spacing between buttons */
        }

        .category-btn {
            width: 120px;
            height: 100px;
            flex: 0 0 auto;
            text-align: center;
            border-radius: 12px;
        }

        .icon-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        /* Custom Green Buttons */
        .btn-success-custom {
            background-color: rgba(71, 135, 120, 1);
            border-color: rgba(71, 135, 120, 1);
            color: #fff;
        }

        .btn-success-custom:hover {
            background-color: rgba(55, 105, 95, 1);
            border-color: rgba(55, 105, 95, 1);
            color: #fff;
        }

        .btn-outline-success-custom {
            color: rgba(71, 135, 120, 1);
            border-color: rgba(71, 135, 120, 1);
            background-color: transparent;
        }

        .btn-outline-success-custom:hover {
            background-color: rgba(71, 135, 120, 1);
            color: #fff;
            border-color: rgba(55, 105, 95, 1);
        }

        /* Sidebar text color */
        nav {
            color: rgba(71, 135, 120, 1);
        }

        /* Sidebar links */
        nav .nav-link {
            color: rgba(71, 135, 120, 1);
        }

        /* Active link */
        nav .nav-link.active {
            background-color: rgba(71, 135, 120, 0.1);
            /* light green background for active */
            color: rgba(71, 135, 120, 1);
        }

        /* Sidebar icons */
        nav i {
            color: rgba(71, 135, 120, 1);
        }

        /* Sidebar username and headings */
        nav .fw-bold {
            color: rgba(71, 135, 120, 1);
        }

        /* Default sidebar link colors */
        nav .nav-link {
            color: rgba(71, 135, 120, 1);
            /* custom green */
            transition: background-color 0.2s ease;
        }

        /* Hover effect: light orange background */
        nav .nav-link:hover {
            background-color: #FFDAB9;
            /* light orange */
            color: rgba(71, 135, 120, 1);
            /* keep text green */
        }

        /* Active link styling (optional) */
        nav .nav-link.active {
            background-color: rgba(71, 135, 120, 0.1);
            /* subtle green */
            color: rgba(71, 135, 120, 1);
        }
    </style>
</head>

<body>
    <!-- ============ HEADER / NAVBAR ============ -->
    <header class="site-header">
        <nav class="site-navbar">
            <div class="site-navbar__logo">
                <a href="/restaurant-system/templates/home.html">Joyeuse's Caribbean Creole Cuisine & Bar</a>
            </div>
            <ul class="site-navbar__menu">
                <li class="site-navbar__menu-item"><a href="/restaurant-system/templates/home.html">Home</a></li>
                <li class="site-navbar__menu-item"><a href="front.html">Front</a></li>
                <li class="site-navbar__menu-item"><a href="kitchen.html">Kitchen</a></li>
                <li class="site-navbar__menu-item"><a href="/reservations.html">Reservations</a></li>
                <li class="site-navbar__menu-item"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>


    <div class="container-fluid">
        <div class="row vh-100">
            <!-- Sidebar -->
            <nav class="col-md-2 d-flex flex-column bg-light p-3">
                <div class="text-center py-3">
                    <a href="#" class="text-decoration-none fs-4 fw-bold text-nowrap">
                        Joyeuse's Caribbean
                    </a>
                    <hr class="mt-2 mb-0" style="border-top: 2px solid rgba(71, 135, 120, 1);">
                </div>

                <!-- User Name -->
                <div class="d-flex justify-content-center align-items-center mb-4">
                    <i class="fa fa-user me-2"></i>
                    <span class="fw-bold">Kim</span>
                </div>

                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-house me-2"></i> Home
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="/orderline">
                            <i class="fa-solid fa-bars-progress"></i> Order Line
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-chart-line me-2"></i> Dashboard
                        </a>
                    </li>

                </ul>

                <!-- Log Out Button (stick to bottom) -->
                <div class="mt-auto text-center">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-2x mb-1"></i>
                    <div>Log Out</div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-7 p-4">
                <!-- Header row with text and search bar -->

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <!-- Left: Title -->
                    <h4 class="mb-0" style="color: rgba(71, 135, 120, 1);">Menu Category</h4>

                    <!-- Right: Search Bar -->
                    <div style="width: 550px;">
                        <input type="text" class="form-control" placeholder="Search food, drink, etc.">
                    </div>
                </div>




                <div class="p-3 rounded bg-light-orange">
                    <!-- Menu Categories -->
                    <div class="d-flex mb-4 menu-container">
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Appetizer')">
                            <img src="https://img.icons8.com/?size=100&id=rRXOjnRDXoKz&format=png&color=000000"
                                class="icon-img mb-2">
                            Appetizer
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Entree')">
                            <img src="https://cdn-icons-png.freepik.com/512/11790/11790098.png" class="icon-img mb-2">
                            Entree
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Fried Platter')">
                            <img src="https://cdn-icons-png.flaticon.com/512/5787/5787040.png" class="icon-img mb-2">
                            Fried Platter
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Sides')">
                            <img src="https://cdn-icons-png.flaticon.com/512/1625/1625093.png" class="icon-img mb-2">
                            Sides
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Energy Drink')">
                            <img src="https://icons.veryicon.com/png/o/food--drinks/drinks-and-food/energy-drink-4.png"
                                class="icon-img mb-2">
                            Energy Drink
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Juice')">
                            <img src="https://cdn-icons-png.flaticon.com/512/5025/5025087.png" class="icon-img mb-2">
                            Juice
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Soft Drink')">
                            <img src="https://cdn-icons-png.flaticon.com/512/4916/4916630.png" class="icon-img mb-2">
                            Soft Drink
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Alcoholic Drink')">
                            <img src="https://cdn-icons-png.flaticon.com/512/2008/2008364.png" class="icon-img mb-2">
                            Alcoholic Drink
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Beer')">
                            <img src="https://cdn-icons-png.flaticon.com/512/761/761777.png" class="icon-img mb-2">
                            Beer
                        </button>
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Liquor')">
                            <img src="https://cdn-icons-png.flaticon.com/512/452/452682.png" class="icon-img mb-2">
                            Liquor
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Add-on')">
                            <img src="https://cdn-icons-png.freepik.com/256/16110/16110320.png?semt=ais_white_label"
                                class="icon-img mb-2">
                            Add-on
                        </button>


                    </div>

                    <!-- Product container -->
                    <h4 class="mb-3">Choose Order</h4>
                    <div id="product-container" class="d-flex flex-wrap gap-3"></div>

                    
            </main>
            <!-- Cart -->
            <!-- Cart -->
            <aside class="col-md-3 p-4 bg-light">
                <h5 class="mb-2" style="color: rgba(71, 135, 120, 1);">Order Number: </h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <tbody>
                            <tr>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Table</option>
                                        <option>Table 1</option>
                                        <option>Table 2</option>
                                        <option>Table 3</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Order Type</option>
                                        <option>Dine-in</option>
                                        <option>Takeout</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Cart items will be rendered here -->
                <div id="cart-items"></div>

                <h5 class="mt-3" id="subtotal">Subtotal: $0.00</h5>
                <button class="btn btn-success-custom w-100 mt-3">Order Now</button>
            </aside>

        </div>
    </div>
    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
        <p class="site-footer__text">
            &copy; 2025 Joyeuse's Caribbean Creole Cuisine & Bar. All rights reserved.
        </p>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
