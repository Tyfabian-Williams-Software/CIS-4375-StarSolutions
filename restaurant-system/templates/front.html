<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/restaurant-system/static/design.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background-color: #FFFDED;
        }

        .bg-light-orange {
            background-color: #FFFDED;
        }

        .menu-container {
            /* Use flexbox with wrapping so buttons keep their size but wrap to the next line when there's no space */
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            width: 100%;
        }

        .category-btn {
            /* Keep current visual size but allow wrapping: fixed base width, vertical layout */
            flex: 0 0 140px;
            /* adjust this to control button width */
            max-width: 180px;
            height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 10px;
            padding: 0.5rem;
            box-sizing: border-box;
        }

        .icon-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }



        .btn-success-custom {
            background-color: #F2542D;
            border-color: #F2542D;
            color: #fff;
        }

        .btn-success-custom:hover {
            background-color: #F2542D;
            border-color: #F2542D;
            color: #fff;
        }

        .btn-outline-success-custom {
            color: #F2542D;
            border-color: #F2542D;
            background-color: transparent;
        }

        .btn-outline-success-custom:hover {
            background-color: #e6bab0;
            color: #fff;
            border-color: #F2542D;
        }

        /* HEADER */
        .site-header {
            background: linear-gradient(to bottom, #001011 0%, #001011 55%, #2d2d2d 100%);
            color: #FFFDED;
            width: 100%;
            position: relative;
            z-index: 1000;
        }

        .site-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .site-navbar__logo a {
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
        }

        .site-navbar__menu {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .site-navbar__menu-item a {
            text-decoration: none;
            color: #FFFDED;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .site-navbar__menu-item a:hover {
            color: #F2542D;
        }

        /* SIDEBAR */
        .order-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            /* start at very top so sidebar covers full right side */
            width: 25%;
            height: 100vh;
            /* full viewport height */
            overflow-y: auto;
            background-color: #e6bab0;
            border-left: 2px solid #eee;
            padding: 10px;
            z-index: 900;
            /* keep header (z-index:1000) above sidebar */
        }

        /* MAIN CONTENT */
        .main-content {
            margin-right: 25%;
            padding: 20px;
            flex: 1;
        }

        /* SIDEBAR */
        .order-sidebar {
            position: fixed;
            right: 0;
            top: 80px;
            width: 25%;
            height: calc(100vh - 140px);
            overflow-y: auto;
            background-color: #ffffff;
            border-left: 1px solid #eee;
            padding: 20px;
        }

        /* FOOTER (always bottom, full width) */
        footer.site-footer {
            background: linear-gradient(to top, #001011 0%, #001011 65%, #2d2d2d 100%);
            color: #FFFDED;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            width: 100%;
            margin-top: auto;
            position: relative;
            bottom: 0;
            left: 0;
            border-top: 1px solid #eee;
        }

        .site-footer__text {
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="site-header">
        <nav class="site-navbar">
            <div class="site-navbar__logo">
                <a href="/restaurant-system/templates/home.html">Joyeuse's Caribbean Creole Cuisine & Bar</a>
            </div>
            <ul class="site-navbar__menu">
                <li class="site-navbar__menu-item"><a href="/restaurant-system/templates/home.html">Home</a></li>
                <li class="site-navbar__menu-item"><a href="front.html">Front</a></li>
                <li class="site-navbar__menu-item"><a href="kitchen.html">Kitchen</a></li>
                <li class="site-navbar__menu-item"><a href="/reservations.html">Reservations</a></li>
                <li class="site-navbar__menu-item"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="container-fluid flex-grow-1">
        <div class="row">
            <!-- LEFT MAIN CONTENT -->
            <main class="main-content col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="mb-0">Menu Category</h4>
                    <div style="width: 600px;">
                        <input type="text" class="form-control" placeholder="Search food, drink, etc."
                            style="border-color: #F2542D;">
                    </div>
                </div>

                <div class="p-3 rounded bg-light-orange">
                    <!-- Menu Categories -->
                    <div class="d-flex mb-4 menu-container">
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Appetizer')">
                            <img src="https://img.icons8.com/?size=100&id=rRXOjnRDXoKz&format=png&color=000000"
                                class="icon-img mb-2">
                            Appetizer
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Entree')">
                            <img src="https://cdn-icons-png.freepik.com/512/11790/11790098.png" class="icon-img mb-2">
                            Entree
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Fried Platter')">
                            <img src="https://cdn-icons-png.flaticon.com/512/5787/5787040.png" class="icon-img mb-2">
                            Fried Platter
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Sides')">
                            <img src="https://cdn-icons-png.flaticon.com/512/1625/1625093.png" class="icon-img mb-2">
                            Sides
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Energy Drink')">
                            <img src="https://icons.veryicon.com/png/o/food--drinks/drinks-and-food/energy-drink-4.png"
                                class="icon-img mb-2">
                            Energy Drink
                        </button>

                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Juice')">
                            <img src="https://cdn-icons-png.flaticon.com/512/5025/5025087.png" class="icon-img mb-2">
                            Juice
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Soft Drink')">
                            <img src="https://cdn-icons-png.flaticon.com/512/4916/4916630.png" class="icon-img mb-2">
                            Soft Drink
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Alcoholic Drink')">
                            <img src="https://cdn-icons-png.flaticon.com/512/2008/2008364.png" class="icon-img mb-2">
                            Alcoholic Drink
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Beer')">
                            <img src="https://cdn-icons-png.flaticon.com/512/761/761777.png" class="icon-img mb-2">
                            Beer
                        </button>
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Liquor')">
                            <img src="https://cdn-icons-png.flaticon.com/512/452/452682.png" class="icon-img mb-2">
                            Liquor
                        </button>
                        <button
                            class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn"
                            onclick="showProducts('Add-on')">
                            <img src="https://cdn-icons-png.freepik.com/256/16110/16110320.png?semt=ais_white_label"
                                class="icon-img mb-2">
                            Add-on
                        </button>


                    </div>

                    <h4 class="mb-3">Choose Order</h4>
                    <div id="product-container" class="d-flex flex-wrap gap-3"></div>
                </div>
            </main>

            <!-- RIGHT SIDEBAR (NEW CART) -->
            <aside class="col-md-2 p-2 order-sidebar">
                <h5 class="mt-2 fw-bold">Order Number: </h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <tbody>
                            <tr>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Table</option>
                                        <option>Table 1</option>
                                        <option>Table 2</option>
                                        <option>Table 3</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Order Type</option>
                                        <option>Dine-in</option>
                                        <option>Takeout</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Subtotal Items -->
                <div class="d-flex align-items-center justify-content-between mb-2 border-bottom pb-2">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center mb-1">
                            <span>Beef Crowich</span>
                        </div>
                        <small class="text-muted">$5.50</small>
                    </div>
                    <div class="d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-success-custom me-2"
                            onclick="changeQty(this,-1)">-</button>
                        <span class="mx-2">1</span>
                        <button class="btn btn-sm btn-outline-success-custom ms-2"
                            onclick="changeQty(this,1)">+</button>
                    </div>
                    <div>
                        <i class="fa-solid fa-trash-can text-danger"></i>
                    </div>
                </div>

                <h5 class="mt-3 fw-bold">Subtotal: $39.94</h5>
                <button class="btn btn-success-custom w-100 mt-3">Order Now</button>
            </aside>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p class="site-footer__text">
            &copy; 2025 Joyeuse's Caribbean Creole Cuisine & Bar. All rights reserved.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
