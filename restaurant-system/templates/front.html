<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

    <style>
        .category-btn {
            width: 120px;
            height: 120px;
            flex: 0 0 auto;
            text-align: center;
            border-radius: 12px;
        }

        .icon-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        /* Custom Green Buttons */
        .btn-success-custom {
            background-color: rgba(71, 135, 120, 1);
            border-color: rgba(71, 135, 120, 1);
            color: #fff;
        }

        .btn-success-custom:hover {
            background-color: rgba(55, 105, 95, 1);
            border-color: rgba(55, 105, 95, 1);
            color: #fff;
        }

        .btn-outline-success-custom {
            color: rgba(71, 135, 120, 1);
            border-color: rgba(71, 135, 120, 1);
            background-color: transparent;
        }

        .btn-outline-success-custom:hover {
            background-color: rgba(71, 135, 120, 1);
            color: #fff;
            border-color: rgba(55, 105, 95, 1);
        }

        /* Sidebar text color */
nav {
    color: rgba(71, 135, 120, 1);
}

/* Sidebar links */
nav .nav-link {
    color: rgba(71, 135, 120, 1);
}

/* Active link */
nav .nav-link.active {
    background-color: rgba(71, 135, 120, 0.1); /* light green background for active */
    color: rgba(71, 135, 120, 1);
}

/* Sidebar icons */
nav i {
    color: rgba(71, 135, 120, 1);
}

/* Sidebar username and headings */
nav .fw-bold {
    color: rgba(71, 135, 120, 1);
}
/* Default sidebar link colors */
nav .nav-link {
    color: rgba(71, 135, 120, 1); /* custom green */
    transition: background-color 0.2s ease;
}

/* Hover effect: light orange background */
nav .nav-link:hover {
    background-color: #FFDAB9; /* light orange */
    color: rgba(71, 135, 120, 1); /* keep text green */
}

/* Active link styling (optional) */
nav .nav-link.active {
    background-color: rgba(71, 135, 120, 0.1); /* subtle green */
    color: rgba(71, 135, 120, 1);
}

    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <!-- Sidebar -->
            <nav class="col-md-2 d-flex flex-column bg-light p-3">
                <div class="text-center py-3">
                    <a href="#" class="text-decoration-none fs-4 fw-bold text-nowrap">
                        Joyeuse's Caribbean
                    </a>
                    <hr class="mt-2 mb-0" style="border-top: 2px solid rgba(71, 135, 120, 1);">
                </div>

                <!-- User Name -->
                <div class="d-flex justify-content-center align-items-center mb-4">
                    <i class="fa fa-user me-2"></i>
                    <span class="fw-bold">Kim</span>
                </div>

                <ul class="nav nav-pills flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-house me-2"></i> Home
                        </a>
                    </li>
                     <li class="nav-item mb-2">
                        <a class="nav-link" href="/orderline">
                            <i class="fa-solid fa-bars-progress"></i> Order Line
                        </a>
                    </li>
                     <li class="nav-item mb-2">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-kitchen-set me-2"></i> Kitchen Station
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="#">
                            <i class="fa-solid fa-chart-line me-2"></i> Dashboard
                        </a>
                    </li>
                   
                </ul>

                <!-- Log Out Button (stick to bottom) -->
                <div class="mt-auto text-center">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-2x mb-1"></i>
                    <div>Log Out</div>
                </div>
            </nav>

            <!-- Main Content -->
<main class="col-md-7 p-4">
 <!-- Header row with text and search bar -->

<div class="d-flex align-items-center justify-content-between mb-4">
    <!-- Left: Title -->
    <h4 class="mb-0" style="color: rgba(71, 135, 120, 1);">Menu Category</h4>

    <!-- Right: Search Bar -->
    <div style="width: 550px;">
        <input type="text" class="form-control" placeholder="Search food, drink, etc.">
    </div>
</div>



   
    <div class="p-3 rounded bg-light-orange">
        <!-- Menu Categories -->
        <div class="d-flex mb-4 gap-3 overflow-auto">
            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://img.icons8.com/?size=100&id=rRXOjnRDXoKz&format=png&color=000000" class="icon-img mb-2">
                Appetizers
            </button>

            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://cdn-icons-png.freepik.com/512/11790/11790098.png" class="icon-img mb-2">
                Entrees
            </button>

            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/5787/5787040.png" class="icon-img mb-2">
                Fried Platters
            </button>

            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/1625/1625093.png" class="icon-img mb-2">
                Sides
            </button>

            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://cdn1.iconfinder.com/data/icons/alcohol-3/64/tequila_shot-512.png" class="icon-img mb-2">
                Shots
            </button>

            <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn">
                <img src="https://img.icons8.com/?size=100&id=lyMuG44EXuxH&format=png&color=000000" class="icon-img mb-2">
                Drink
            </button>
        </div>

        <!-- Menu Items -->
        <h4 class="mb-3">Choose Order</h4>
       <div class="d-flex flex-wrap gap-3">
    <!-- Item 1 -->
<div class="d-flex flex-wrap gap-3">
    <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn" 
            style="width:150px; height:170px; border-radius:12px;" 
            onclick="addToCart('Beef Crowich', 5.5)">
        <img src="https://i.postimg.cc/0yCDSJk3/fried-pork-platter.png" 
             class="icon-img mb-2" 
             style="width:100%; height:100px; object-fit:cover; border-radius:12px 12px 0 0;">
        <span class="fw-semibold mb-1">Beef Crowich</span>
        <span class="text-muted">$5.50</span>
    </button>
</div>

<div class="d-flex flex-wrap gap-3">
    <button class="btn btn-outline-success-custom d-flex flex-column justify-content-center align-items-center category-btn" 
            style="width:150px; height:170px; border-radius:12px;" 
            onclick="addToCart('Beef Crowich', 5.5)">
        <img src="https://i.postimg.cc/SQ3cWhW6/pate-kode.png" 
             class="icon-img mb-2" 
             style="width:100%; height:100px; object-fit:cover; border-radius:12px 12px 0 0;">
        <span class="fw-semibold mb-1">Beef Crowich</span>
        <span class="text-muted">$5.50</span>
    </button>
</div>
</main>


            <!-- Cart -->
            <aside class="col-md-3 p-4 bg-light">
                <h5 class="mb-2" style="color: rgba(71, 135, 120, 1);">Order Number: </h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <tbody>
                            <tr>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Table</option>
                                        <option>Table 1</option>
                                        <option>Table 2</option>
                                        <option>Table 3</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option selected>Choose Order Type</option>
                                        <option>Dine-in</option>
                                        <option>Takeout</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
               
                </div>
                
                <!-- Subtotal Items -->
                <div class="d-flex align-items-center justify-content-between mb-2 border-bottom pb-2">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center mb-1">
                            <span class="fw-semibold">Beef Crowich</span>
                        </div>
                        <small class="text-muted">$5.50</small>
                    </div>
                    <div class="d-flex align-items-center me-3">
                        <button class="btn btn-sm btn-outline-success-custom me-2" onclick="changeQty(this,-1)">-</button>
                        <span class="mx-2">1</span>
                        <button class="btn btn-sm btn-outline-success-custom ms-2" onclick="changeQty(this,1)">+</button>
                    </div>
                    <div>
                        <i class="fa-solid fa-trash-can text-danger"></i>
                    </div>
                </div>

                <h5 class="mt-3">Subtotal: $39.94</h5>
                <button class="btn btn-success-custom w-100 mt-3">Order Now</button>
            </aside>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

   
</body>
</html>
